[project]
name = "btfi"
version = "0.1.0"
description = "BTFI - Buy The Fucking Index: rigorous investment strategy backtesting lab vs S&P 500"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.12",
    "yfinance>=0.2.40",
    "duckdb>=1.0",
    "pyarrow>=15",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "typer>=0.12",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "httpx", "ruff", "openpyxl"]

[project.scripts]
btfi = "btfi.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
